name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "::error::VERSION file is empty or missing"
            exit 1
          fi
          if [[ "$version" != "$tag" ]]; then
            echo "::error::VERSION file ($version) does not match git tag ($tag)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Cross-compile binaries
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: ./build.sh cross
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            dist/smytm-*-linux-amd64
            dist/smytm-*-linux-arm64
            dist/smytm-*-linux-riscv64
            dist/smytm-*-darwin-amd64
            dist/smytm-*-darwin-arm64
            dist/smytm-*-windows-amd64.exe
            dist/smytm-*-windows-arm64.exe
          if-no-files-found: error

  deb:
    name: .deb (${{ matrix.goarch }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            nfpm_arch: amd64
          - goarch: arm64
            nfpm_arch: arm64
          - goarch: riscv64
            nfpm_arch: riscv64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: ./build.sh go
      - name: Package .deb
        env:
          ARCH: ${{ matrix.nfpm_arch }}
          VERSION: ${{ needs.version.outputs.version }}
          GOTOOLCHAIN: auto
        run: |
          mkdir -p dist
          # Pinned to a specific version
          go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0 pkg \
            --packager deb \
            --config packaging/nfpm.yaml \
            --target dist/
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.goarch }}
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: .rpm (${{ matrix.goarch }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            nfpm_arch: amd64
          - goarch: arm64
            nfpm_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: ./build.sh go
      - name: Package .rpm
        env:
          ARCH: ${{ matrix.nfpm_arch }}
          VERSION: ${{ needs.version.outputs.version }}
          GOTOOLCHAIN: auto
        run: |
          mkdir -p dist
          # Pinned to a specific version
          go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0 pkg \
            --packager rpm \
            --config packaging/nfpm.yaml \
            --target dist/
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.goarch }}
          path: dist/*.rpm
          if-no-files-found: error

  arch-x86_64:
    name: Arch package (x86_64)
    needs: version
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel go git ffmpeg sudo
      - name: Create non-root builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE/src"
      - name: Build package
        run: |
          su builder -c "cd \"$GITHUB_WORKSPACE/src\" && ./build.sh arch"
      - uses: actions/upload-artifact@v7
        with:
          name: arch-x86_64
          path: src/dist/*.pkg.tar.zst
          if-no-files-found: error

  arch-aarch64:
    name: Arch package (aarch64)
    needs: version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - name: Build in ARM Arch container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD/src:/build" \
            -w /build \
            menci/archlinuxarm:base-devel \
            bash -c '
              set -e
              pacman -Syu --noconfirm --needed --disable-sandbox
              pacman -S --noconfirm --needed --disable-sandbox go git ffmpeg sudo
              useradd -m builder || true
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /build
              su builder -c "./build.sh arch"
            '
      - name: Reclaim ownership
        run: sudo chown -R "$(id -u):$(id -g)" src
      - uses: actions/upload-artifact@v7
        with:
          name: arch-aarch64
          path: src/dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, binaries, deb, rpm, arch-x86_64, arch-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten and checksum
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > checksums.txt
          echo "── Artifacts to publish ──"
          ls -lh

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
