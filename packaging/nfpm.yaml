name: smytm
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: SmileLulz <SmileLulz@users.noreply.github.com>
description: CLI for searching and downloading music from YouTube Music
homepage: https://github.com/SmileLulz/smytm
license: GPL-3.0-only

depends:
  - ffmpeg

contents:
  - src: ./smytm
    dst: /usr/bin/smytm
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/licenses/smytm/LICENSE
    file_info:
      mode: 0644
  - src: ./README.md
    dst: /usr/share/doc/smytm/README.md
    file_info:
      mode: 0644
