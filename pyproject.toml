[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmgrab"
version = "1.2.1"
description = "Download and search YouTube Music audio"
readme = "README.md"
authors = [
    {name = "SmileLulz"},
]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # Intentionally empty: yt-dlp, ffmpeg, curl, chafa, ytmusicapi, mutagen,
    # and (optionally) rsgain are all required/optional at runtime, not at install time.
    # They are checked on demand by
    # utils.check_dependencies() / search.check_search_dependencies(),
    # and declared as package dependencies in PKGBUILD instead.
    # This keeps a plain `pip install ytmgrab` lightweight for users who bring their own system tools.
]

[project.urls]
Repository = "https://codeberg.org/SmileLulz404/ytmgrab"

[project.scripts]
ytmgrab = "ytmgrab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ytmgrab*"]
